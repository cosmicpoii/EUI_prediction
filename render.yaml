services:
  - type: web
    name: apartment-eui-predictor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn eui_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EUI_MODEL_PATH
        value: models_torch_range2_physics_1/eui_ann_torch_model.pt
      - key: EUI_SCALER_PATH
        value: models_torch_range2_physics_1/eui_ann_torch_scalers.joblib
      - key: EUI_CORS_ORIGINS
        value: "*"
      - key: ANTHROPIC_API_KEY
        sync: false
